[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "session-build-ledger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "email-validator>=2.2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["developer_auth", "build_ledger", "release_policy"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
